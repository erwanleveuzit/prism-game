plugins {
    id 'com.android.application'
}

android {
    namespace 'com.prism.game'
    compileSdk 34

    defaultConfig {
        applicationId "com.prism.game"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    signingConfigs {
        release {
            storeFile file("../prism-release.jks")
            storePassword System.getenv("KEYSTORE_PASSWORD") ?: "prism2024secure"
            keyAlias System.getenv("KEY_ALIAS") ?: "prism"
            keyPassword System.getenv("KEY_PASSWORD") ?: "prism2024secure"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
}
